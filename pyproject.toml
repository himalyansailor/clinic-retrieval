[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-retrieval"
version = "0.1.0"
description = "Offline, multilingual, multi-agent question answering for rural clinics: health schemes, drug availability and protocols in Hindi and English."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "himalyansailor" }]
keywords = ["rag", "multi-agent", "llm", "hybrid-retrieval", "multilingual", "hindi", "guardrails", "offline-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The retrieval pipeline needs the embedding model; the rest is the HTTP layer.
dependencies = [
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/himalyansailor/clinic-retrieval"

[tool.setuptools.packages.find]
include = ["clinic_retrieval*"]

[tool.setuptools.package-data]
clinic_retrieval = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient`.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731"]
