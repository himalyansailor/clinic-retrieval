name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU torch keeps the install to a few hundred MB instead of several GB.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # The embedding model is ~120MB; cache it so CI does not refetch it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      # The generative model is a scripted stand-in (tests/conftest.py), so
      # this runs the whole pipeline with no weights served.
      - run: pytest -q
      - run: python -m scripts.evaluate
